# Netlify config for the kiosk UI.
#
# The app talks directly to Firebase Firestore (see firebase.config.json,
# committed — a Firebase Web API key is not a secret, access is controlled by
# Firestore Security Rules). No backend server, no VITE_API_URL needed.
#
# DSLR capture and printing are done by agent/index.cjs running on the booth
# PC (npm run agent / start-photobooth.bat) — it talks to the same Firebase
# project over a job queue, no exposed port or tunnel required.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# React Router — serve index.html for any path so client-side routing
# (including /d/:id, the photo download page) works.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
